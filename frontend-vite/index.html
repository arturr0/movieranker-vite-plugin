<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieRanker</title>

    <!-- Ikona -->
    <link
      rel="icon"
      type="image/x-icon"
      href="https://cdn.glitch.global/9b6e30d1-a1c2-46a0-a831-d48ce809e60a/iconfinder-video-film-camera-movie-photography-4593167_122280.ico?v=1750964605873"
    />

    <!-- Google Fonts (poprawione preload) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css?family=Oswald:400|Open+Sans:700"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Oswald:400|Open+Sans:700"
      />
    </noscript>

    <!-- Font Awesome (CDN bez problemów CORS) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
    />

    <!-- Style lokalne -->
    <link rel="stylesheet" href="/styles/auth.css" />
    <link rel="stylesheet" href="/styles/movies.css" />
    <link rel="stylesheet" href="/styles/fontello.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Główna aplikacja React -->
    <script type="module" src="/src/main.jsx"></script>

</html>
